<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560" role="img" aria-label="Wanted poster: Mobo, product designer and vibe-coder. Bounty: 11,000,000+ users served.">
  <defs>
    <radialGradient id="paper" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#F6E7C1"/>
      <stop offset="0.7" stop-color="#E8CF98"/>
      <stop offset="1" stop-color="#C9A465"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3D9A0"/>
      <stop offset="1" stop-color="#E2BC7A"/>
    </linearGradient>
  </defs>

  <!-- paper with slightly torn corners -->
  <path d="M14 10 L120 6 L210 12 L300 5 L388 11 L392 120 L386 260 L393 400 L387 552 L280 556 L190 549 L90 555 L10 550 L15 410 L8 270 L14 130 Z" fill="url(#paper)" stroke="#8B5E34" stroke-width="2"/>
  <circle cx="200" cy="26" r="6" fill="#7A4B25"/>

  <text x="200" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="bold" letter-spacing="6" fill="#4A2C17">WANTED</text>

  <!-- portrait frame -->
  <rect x="60" y="112" width="280" height="210" fill="url(#sky)" stroke="#4A2C17" stroke-width="4"/>

  <!-- pen-tool nib, the designer's weapon -->
  <g transform="translate(200 250)">
    <path d="M0 -38 L26 6 L10 40 L-10 40 L-26 6 Z" fill="#3B2A1E"/>
    <path d="M0 -30 L0 10" stroke="#F3D9A0" stroke-width="3"/>
    <circle cx="0" cy="12" r="6" fill="#F3D9A0"/>
    <rect x="-14" y="40" width="28" height="12" rx="2" fill="#3B2A1E"/>
    <!-- little bezier handles -->
    <line x1="-82" y1="30" x2="-40" y2="-4" stroke="#B91C1C" stroke-width="3"/>
    <rect x="-90" y="22" width="14" height="14" fill="#F6E7C1" stroke="#B91C1C" stroke-width="3"/>
    <line x1="82" y1="30" x2="40" y2="-4" stroke="#B91C1C" stroke-width="3"/>
    <circle cx="84" cy="30" r="7" fill="#F6E7C1" stroke="#B91C1C" stroke-width="3"/>
  </g>

  <!-- straw hat sitting on top of the pen -->
  <g transform="translate(200 196)">
    <ellipse cx="0" cy="14" rx="92" ry="20" fill="#E9B949" stroke="#8B5E34" stroke-width="3"/>
    <path d="M-48 12 C-48 -34 48 -34 48 12 Z" fill="#F2C75C" stroke="#8B5E34" stroke-width="3"/>
    <path d="M-47 2 C-30 10 30 10 47 2 L48 12 C30 20 -30 20 -48 12 Z" fill="#B91C1C"/>
    <path d="M-70 18 Q0 30 70 18" fill="none" stroke="#C99A33" stroke-width="2" stroke-dasharray="5 4"/>
  </g>

  <text x="200" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" letter-spacing="4" fill="#4A2C17">MOBO</text>
  <text x="200" y="398" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#5C3A1E">"Product Designer who vibe-codes"</text>

  <text x="200" y="432" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="2" fill="#5C3A1E">WANTED FOR SHIPPING DESIGNS STRAIGHT TO CODE</text>
  <text x="200" y="449" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="2" fill="#5C3A1E">WITHOUT WAITING FOR A HANDOFF</text>

  <line x1="70" y1="466" x2="330" y2="466" stroke="#8B5E34" stroke-width="1.5"/>
  <text x="200" y="503" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#4A2C17">⚓ 11,000,000+</text>
  <text x="200" y="524" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="1" fill="#5C3A1E">users served · last seen running in İzmir · approach with coffee</text>
</svg>
