    <text x="1010" y="130" text-anchor="middle" font-size="40" font-weight="bold" fill="#B91C1C">50→30%</text>
    <text x="1010" y="246" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A2D29">bounce rate</text>
    <text x="1010" y="268" text-anchor="middle" font-size="15" font-style="italic" fill="#6B4A3A">reworked IA</text>
  </g>
    <!-- X marks the next treasure -->
    <g transform="translate(1126 262)" stroke="#B91C1C" stroke-width="7" stroke-linecap="round">
