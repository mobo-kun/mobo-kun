<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-label="Treasure map of results: login success rose from 48% to 58% after 3 research cycles; 138K sign-ups in 24 hours with 80% of trades going through at peak load; 4 micro-interactions coded and shipped by me with Claude Code in 2 weeks; plus 25% Direct Debit adoption for 18K vendors at Cafe Bazaar; bounce rate cut from 50% to 30% by reworking the information architecture.">
  <defs>
    <radialGradient id="p" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#F7EDE2"/><stop offset="0.8" stop-color="#EEDDCB"/><stop offset="1" stop-color="#DCC2AA"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="370" rx="18" fill="url(#p)"/>
  <rect x="12" y="12" width="1176" height="346" rx="12" fill="none" stroke="#4A2D29" stroke-width="2" stroke-dasharray="2 6" opacity="0.5"/>

  <!-- the route -->
