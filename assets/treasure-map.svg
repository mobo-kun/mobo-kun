    <path d="M0 -30 L7 0 L0 30 L-7 0 Z"/><path d="M-30 0 L0 -6 L30 0 L0 6 Z" opacity="0.5"/>
    <text y="-40" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold">N</text>
  </g>
</svg>
