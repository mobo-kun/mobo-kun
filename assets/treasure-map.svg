        fill="none" stroke="#4A2D29" stroke-width="3" stroke-dasharray="10 9" stroke-linecap="round" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="0" to="-38" dur="2.5s" repeatCount="indefinite"/>
  </path>

