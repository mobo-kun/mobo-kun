    <ellipse cx="350" cy="240" rx="64" ry="17" fill="#E9C98A" stroke="#4A2D29" stroke-width="2"/>
    <path d="M320 234 q30 -20 60 0 z" fill="#7CB342" stroke="#4A2D29" stroke-width="2"/>
