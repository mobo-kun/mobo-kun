    <text x="130" y="130" text-anchor="middle" font-size="40" font-weight="bold" fill="#B91C1C">48→58%</text>
    <text x="130" y="246" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A2D29">login success</text>
    <text x="130" y="268" text-anchor="middle" font-size="15" font-style="italic" fill="#6B4A3A">3 research cycles</text>
  </g>
  <g>
