    <text x="570" y="130" text-anchor="middle" font-size="40" font-weight="bold" fill="#B91C1C">4</text>
    <text x="570" y="246" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A2D29">micro-interactions</text>
    <text x="570" y="268" text-anchor="middle" font-size="15" font-style="italic" fill="#6B4A3A">coded &amp; shipped by me</text>
  </g>
