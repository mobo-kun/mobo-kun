    <text x="790" y="170" text-anchor="middle" font-size="40" font-weight="bold" fill="#B91C1C">+25%</text>
    <text x="790" y="286" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A2D29">Direct Debit adoption</text>
    <text x="790" y="308" text-anchor="middle" font-size="15" font-style="italic" fill="#6B4A3A">18K vendors</text>
  </g>
  <g>
    <ellipse cx="1010" cy="206" rx="76" ry="20" fill="#9FC9E8" opacity="0.6"/>
